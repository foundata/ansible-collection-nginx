## Regression: stale module cleanup runs when the enabled list is emptied
#
# Debian-only (because that is where the role manages modules as symlinks); Platforms
# without symlink-type modules (RedHat, SUSE) yield an empty managed set and remove
# nothing.
- name: "Molecule | Verify | Validate stale module cleanup on emptied list (Debian)"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian'
  vars:
    __testing_managed_module_filenames: >-
      {{
        (run_nginx_modules_enabled | ansible.builtin.default([]))
        | ansible.builtin.select('in', __run_nginx_modules_map_resources.keys() | ansible.builtin.list)
        | ansible.builtin.map('extract', __run_nginx_modules_map_resources)
        | ansible.builtin.map(attribute='conf_files')
        | ansible.builtin.flatten
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.unique
        | ansible.builtin.list
      }}
  block:

    - name: "Molecule | Verify | Stat role-managed module configs before emptying the list"
      ansible.builtin.stat:
        path: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}/{{ item }}"
      register: __testing_module_before
      loop: "{{ __testing_managed_module_filenames }}"


    - name: "Molecule | Verify | Assert at least one role-managed module config exists before"
      ansible.builtin.assert:
        that:
          - (__testing_module_before['results'] | ansible.builtin.selectattr('stat.exists') | ansible.builtin.list | ansible.builtin.length) > 0
        fail_msg: "No role-managed module configs found before test; setup invalid (managed={{ __testing_managed_module_filenames }})."
        success_msg: "Role-managed module configs exist before emptying the list."


    - name: "Molecule | Verify | Re-run role with an empty module list (disable_unmanaged)"
      ansible.builtin.include_role:
        name: "foundata.nginx.run"
      vars:
        run_nginx_modules_enabled: []
        run_nginx_modules_disable_unmanaged: true


    - name: "Molecule | Verify | Stat role-managed module configs after emptying the list"
      ansible.builtin.stat:
        path: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}/{{ item }}"
      register: __testing_module_after
      loop: "{{ __testing_managed_module_filenames }}"


    - name: "Molecule | Verify | Assert role-managed module configs were removed"
      ansible.builtin.assert:
        that:
          - (__testing_module_after['results'] | ansible.builtin.selectattr('stat.exists') | ansible.builtin.list | ansible.builtin.length) == 0
        fail_msg: "Stale module configs remained after emptying run_nginx_modules_enabled."
        success_msg: "Emptying run_nginx_modules_enabled removed the role-managed module configs."


## Migration: pre-existing, unmanaged site configs (brownfield)
#
# Taking over a host that already serves sites is the common migration case, and
# run_nginx_sites_delete_unmanaged decides what happens to those files. Both
# directions are contractual: with deletion enabled the role owns the site
# directories exclusively, with it disabled foreign sites must survive so the
# role can be adopted next to an existing setup.
#
# The planted site is created in sites-available only and never enabled, so it
# stays inert and cannot influence the configuration test that the role's
# handlers run. Deletion is exercised regardless, because the role searches both
# the available and the enabled directory.
#
# Order matters: the preserving run comes first, so the removing run afterwards
# leaves the host in the clean state the uninstall regression below expects.

- name: "Molecule | Verify | Validate unmanaged site handling on migration (integration)"
  vars:
    __testing_unmanaged_site: >-
      {{ __run_nginx_config_service_dropin_sites_available_dir_path }}/molecule-unmanaged.conf
    __testing_managed_site: >-
      {{ __run_nginx_config_service_dropin_sites_available_dir_path }}/example.com.conf
  block:

    - name: "Molecule | Verify | Plant a pre-existing, unmanaged site config"
      ansible.builtin.copy:
        content: |
          # Unmanaged site planted by the molecule test to simulate a host that
          # already served sites before the role was adopted.
          server {
              listen 8099;
              server_name molecule-unmanaged.example.net;
              root /var/www/example.com;
          }
        dest: "{{ __testing_unmanaged_site }}"
        owner: "{{ __run_nginx_config_service_dropin_sites_available_dir_owner }}"
        group: "{{ __run_nginx_config_service_dropin_sites_available_dir_group }}"
        mode: "u=rw,g=r,o=r" # 0644


    - name: "Molecule | Verify | Re-run the role with unmanaged site deletion disabled"
      ansible.builtin.include_role:
        name: "foundata.nginx.run"
      vars:
        run_nginx_sites_delete_unmanaged: false


    - name: "Molecule | Verify | Stat the unmanaged site after the run with deletion disabled"
      ansible.builtin.stat:
        path: "{{ __testing_unmanaged_site }}"
      register: __testing_unmanaged_site_kept


    - name: "Molecule | Verify | Assert the unmanaged site survives when deletion is disabled"
      ansible.builtin.assert:
        that:
          - __testing_unmanaged_site_kept['stat']['exists']
        fail_msg: >-
          The unmanaged site '{{ __testing_unmanaged_site }}' was removed even though
          run_nginx_sites_delete_unmanaged was false. Adopting the role next to an existing
          setup would delete foreign sites.
        success_msg: >-
          The unmanaged site was left untouched while run_nginx_sites_delete_unmanaged was
          false.


    - name: "Molecule | Verify | Re-run the role with unmanaged site deletion enabled"
      ansible.builtin.include_role:
        name: "foundata.nginx.run"
      vars:
        run_nginx_sites_delete_unmanaged: true


    - name: "Molecule | Verify | Stat the unmanaged and a managed site after the run with deletion enabled"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ __testing_unmanaged_site }}"
        - "{{ __testing_managed_site }}"
      register: __testing_unmanaged_site_reaped


    - name: "Molecule | Verify | Assert the unmanaged site is removed while the managed one stays"
      ansible.builtin.assert:
        that:
          - not __testing_unmanaged_site_reaped['results'][0]['stat']['exists']
          - __testing_unmanaged_site_reaped['results'][1]['stat']['exists']
        fail_msg: >-
          Enabling run_nginx_sites_delete_unmanaged did not remove the unmanaged site
          '{{ __testing_unmanaged_site }}', or it also removed the managed site
          '{{ __testing_managed_site }}'.
        success_msg: >-
          Enabling run_nginx_sites_delete_unmanaged removed the unmanaged site and kept the
          managed one.


# Flush pending config-validation/restart handlers now, while the role is still
# installed and its configuration is valid, so they do not run at play end after
# the uninstall regression below has removed the package and its config.
- name: "Molecule | Verify | Flush handlers before the uninstall regression"
  ansible.builtin.meta: flush_handlers


## Regression: uninstall removes managed site files/symlinks by absolute path
#
# This block runs LAST because it uninstalls the role. It guards the uninstall
# path-join fix: managed site configs were removed by bare filename (e.g.
# "example.com.conf"), which did not resolve, so they survived on Debian/SUSE
# where the site directories are kept. A managed site file in sites-available
# and its sites-enabled symlink must exist after converge and be gone after a
# run_nginx_state: absent run.

- name: "Molecule | Verify | Validate uninstall removes managed site files (integration)"
  vars:
    __testing_uninstall_site_available: "{{ __run_nginx_config_service_dropin_sites_available_dir_path }}/example.com.conf"
    __testing_uninstall_site_enabled: "{{ __run_nginx_config_service_dropin_sites_enabled_dir_path }}/example.com.conf"
  block:

    - name: "Molecule | Verify | Stat managed site file and symlink before uninstall"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_uninstall_before
      loop:
        - "{{ __testing_uninstall_site_available }}"
        - "{{ __testing_uninstall_site_enabled }}"

    - name: "Molecule | Verify | Assert managed site file and symlink exist before uninstall"
      ansible.builtin.assert:
        that:
          - __testing_uninstall_before['results'][0]['stat']['exists']
          - __testing_uninstall_before['results'][1]['stat']['exists']
        fail_msg: "Managed site file/symlink missing before uninstall; test setup invalid."
        success_msg: "Managed site file and enabled symlink exist before uninstall."

    - name: "Molecule | Verify | Uninstall the role (run_nginx_state: absent)"
      ansible.builtin.include_role:
        name: "foundata.nginx.run"
      vars:
        run_nginx_state: "absent"

    - name: "Molecule | Verify | Stat managed site file and symlink after uninstall"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_uninstall_after
      loop:
        - "{{ __testing_uninstall_site_available }}"
        - "{{ __testing_uninstall_site_enabled }}"

    - name: "Molecule | Verify | Assert managed site file and symlink were removed by uninstall"
      ansible.builtin.assert:
        that:
          - not __testing_uninstall_after['results'][0]['stat']['exists']
          - not __testing_uninstall_after['results'][1]['stat']['exists']
        fail_msg: >-
          Uninstall left managed site files behind (available exists={{ __testing_uninstall_after['results'][0]['stat']['exists'] }},
          enabled exists={{ __testing_uninstall_after['results'][1]['stat']['exists'] }}).
        success_msg: "Uninstall removed the managed site file and its enabled symlink."


## Regression tests: init-only merged variable evaluation
#
# Re-run the role's init with controlled inputs and assert the merged
# directive/snippet variables directly (whether materialized in tasks/init.yml
# or lazily in vars/main.yml): defaults must render, a simulated platform
# override must win for the main directives, and the snippet settings must
# layer defaults, the (RedHat-family) platform override and the user settings
# correctly.
#
# Inputs are set via set_fact so they outrank the converge-time facts restored
# at the top of this file and stay in scope when the assertions dereference the
# (lazily evaluated) effective variables. This runs LAST: the set_fact of the
# internal __run_nginx_main_directives_overwrite would otherwise shadow the
# platform include_vars value (e.g. Debian's "user www-data") and leak into any
# full role run that follows. Only role init runs here, so it needs no package.

- name: "Molecule | Verify | Validate effective merged variables (init-only)"
  block:

    - name: "Molecule | Verify | Set controlled inputs for the merge checks"
      ansible.builtin.set_fact:
        __run_nginx_main_directives_overwrite:
          worker_processes: "4"
        run_nginx_snippet_settings:
          hsts:
            max_age: 4321


    - name: "Molecule | Verify | Re-initialize nginx with controlled inputs"
      ansible.builtin.include_role:
        name: "foundata.nginx.run"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert effective main directives merged correctly"
      ansible.builtin.assert:
        that:
          # simulated platform override wins over the default ("auto")
          - __run_nginx_effective_main_directives['worker_processes'] == "4"
          # an untouched default survives
          - __run_nginx_effective_main_directives['pid'] == "/run/nginx.pid"
        fail_msg: "__run_nginx_effective_main_directives did not merge defaults and overrides as expected."
        success_msg: "__run_nginx_effective_main_directives merged defaults and overrides correctly."


    - name: "Molecule | Verify | Assert effective events and http directives render defaults"
      ansible.builtin.assert:
        that:
          - __run_nginx_effective_events_directives['worker_connections'] == 1024
          - __run_nginx_effective_http_directives['sendfile'] | ansible.builtin.bool
          - __run_nginx_effective_http_directives['keepalive_timeout'] == 65
        fail_msg: "__run_nginx_effective_events_directives / _http_directives did not render the expected defaults."
        success_msg: "__run_nginx_effective_events_directives and _http_directives rendered the expected defaults."


    - name: "Molecule | Verify | Assert effective snippet settings merged correctly"
      ansible.builtin.assert:
        that:
          # user setting wins (highest priority)
          - __run_nginx_effective_snippet_settings['hsts']['max_age'] == 4321
          # the tls-baseline dhparam_path resolves to the platform's DH params
          # path (set per platform in vars/main.yml or vars/<platform>.yml);
          # comparing to the internal var keeps this assertion platform-agnostic.
          - __run_nginx_effective_snippet_settings['tls-baseline']['dhparam_path'] == __run_nginx_dhparam_ffdhe3072_path
          # an untouched default survives
          - __run_nginx_effective_snippet_settings['php-fpm']['tcp_port'] == 9000
        fail_msg: "__run_nginx_effective_snippet_settings did not merge defaults, platform overrides and user settings as expected."
        success_msg: "__run_nginx_effective_snippet_settings merged defaults, platform overrides and user settings correctly."
