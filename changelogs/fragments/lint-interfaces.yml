---
minor_changes:
  - >-
    Add role-prefixed handler topics and use them for internal notifications.
    Retain the previous topics as migration aliases until version 2.0.0.
  - >-
    Add the handler topic run_nginx_validate_configuration
    as the replacement for "run_nginx: validate configuration".
  - >-
    Add the handler topic run_nginx_restart_nginx
    as the replacement for "run_nginx: restart nginx.service".
  - >-
    Add the handler topic run_nginx_reload_nginx
    as the replacement for "run_nginx: reload nginx.service".
  - >-
    Add the handler topic run_nginx_reload_systemd_daemon
    as the replacement for "run_nginx: systemd daemon-reload".
