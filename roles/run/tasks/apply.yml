---
- name: "Apply | Consume the service action requested for this flush"
  ansible.builtin.set_fact:
    __run_nginx_apply_state: "{{ 'restarted' if (__run_nginx_restart_pending | ansible.builtin.default(false)) else 'reloaded' }}"
    __run_nginx_restart_pending: false

- name: "Apply | Validate before reloading or restarting NGINX"
  ansible.builtin.import_tasks: "validate.yml"
  when:
    - run_nginx_service_state in ['enabled', 'running']

- name: "Apply | Reload or restart NGINX"
  ansible.builtin.systemd_service:
    name: "{{ __run_nginx_nginx_servicename }}"
    state: "{{ __run_nginx_apply_state }}"
  when:
    - run_nginx_service_state in ['enabled', 'running']
