# Uninstall: Manage basic resource removal, such as packages or service users.

---

- name: "Setup | Uninstall | Gather service facts"
  ansible.builtin.service_facts:


- name: "Setup | Uninstall | Stop and disable service (best-effort): {{ __run_nginx_nginx_servicename }}"
  ansible.builtin.systemd_service:
    name: "{{ __run_nginx_nginx_servicename }}"
    state: "stopped"
    enabled: false
  failed_when: false # best-effort service stop
  when:
    - __run_nginx_nginx_servicename in ansible_facts['services']


- name: "Setup | Uninstall | Remove drop-in config files (snippets, sites)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  vars:
    __run_nginx_managed_site_filenames: >-
      {{
        (run_nginx_sites_config | ansible.builtin.default([]))
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.map('ansible.builtin.regex_replace', '$', '.conf')
        | ansible.builtin.list
      }}
    __run_nginx_paths_to_remove: >-
      {{
        (
          (
            __run_nginx_managed_site_filenames
            | ansible.builtin.map('ansible.builtin.regex_replace', '^', __run_nginx_config_service_dropin_sites_available_dir_path ~ '/')
            | ansible.builtin.list
          )
          +
          (
            __run_nginx_managed_site_filenames
            | ansible.builtin.map('ansible.builtin.regex_replace', '^', __run_nginx_config_service_dropin_sites_enabled_dir_path ~ '/')
            | ansible.builtin.list
          )
          +
          [
            __run_nginx_config_service_file_path,
            __run_nginx_config_service_dropin_snippets_http_dir_path,
            __run_nginx_config_service_dropin_snippets_location_dir_path,
            __run_nginx_config_service_dropin_snippets_server_dir_path
          ]
        ) | ansible.builtin.unique
      }}
  when:
    - __run_nginx_paths_to_remove | ansible.builtin.length > 0
  loop: "{{ __run_nginx_paths_to_remove }}"


# Historical sites (renamed or de-listed since deployment) cannot be derived
# from the current run_nginx_sites_config value. On Debian/SUSE the site
# directories are kept, so sweep them for files carrying the role's ownership
# marker (the list-based removal above still covers files from releases that
# predate the marker).
- name: "Setup | Uninstall | Find remaining site config files"
  ansible.builtin.find:
    paths:
      - "{{ __run_nginx_config_service_dropin_sites_available_dir_path }}"
      - "{{ __run_nginx_config_service_dropin_sites_enabled_dir_path }}"
    patterns:
      - "*.conf"
    # "any" so enabled-site symlinks are matched too (grep dereferences them,
    # so a symlink to a marker-carrying file is removed alongside its target)
    file_type: "any"
    hidden: true
  register: __run_nginx_uninstall_find_result


- name: "Setup | Uninstall | Determine marker-managed site config files"
  ansible.builtin.command:
    argv: >-
      {{
        [__run_nginx_grep_exec_path, '-l', '-s', '-x', '-F', '--', __run_nginx_config_file_marker]
        + (__run_nginx_uninstall_find_result['files']
           | ansible.builtin.rejectattr('isdir')
           | ansible.builtin.map(attribute='path') | ansible.builtin.list)
      }}
  register: __run_nginx_uninstall_owned_result
  changed_when: false
  failed_when:
    - __run_nginx_uninstall_owned_result['rc'] not in [0, 1, 2]
  when:
    - (__run_nginx_uninstall_find_result['files'] | ansible.builtin.length) > 0


- name: "Setup | Uninstall | Remove marker-managed site config files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop: "{{ __run_nginx_uninstall_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item }}"


- name: "Setup | Uninstall | Remove snippets directory (non-Debian platforms)"
  ansible.builtin.file:
    path: "{{ __run_nginx_config_service_dropin_snippets_dir_path }}"
    state: "absent"
  when:
    - ansible_facts['os_family'] != 'Debian'


- name: "Setup | Uninstall | Remove sites directories (non-Debian/SUSE platforms)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  when:
    - ansible_facts['os_family'] not in ['Debian', 'Suse']
  loop:
    - "{{ __run_nginx_config_service_dropin_sites_available_dir_path }}"
    - "{{ __run_nginx_config_service_dropin_sites_enabled_dir_path }}"


- name: "Setup | Uninstall | Check if platform's original nginx.conf backup exists"
  ansible.builtin.stat:
    path: "{{ __run_nginx_config_service_file_distbackup_path }}"
  register: __run_nginx_distbackup_stat


- name: "Setup | Uninstall | Restore platform's original nginx.conf from backup"
  when:
    - __run_nginx_distbackup_stat['stat']['exists']
  block:
    - name: "Setup | Uninstall | Restore nginx.conf from backup file"
      ansible.builtin.copy:
        src: "{{ __run_nginx_config_service_file_distbackup_path }}"
        dest: "{{ __run_nginx_config_service_file_path }}"
        owner: "{{ __run_nginx_config_service_file_owner }}"
        group: "{{ __run_nginx_config_service_file_group }}"
        mode: "{{ __run_nginx_config_service_file_mode }}"
        remote_src: true

    - name: "Setup | Uninstall | Remove backup notice comment from restored nginx.conf"
      ansible.builtin.lineinfile:
        path: "{{ __run_nginx_config_service_file_path }}"
        line: "{{ __run_nginx_config_service_file_distbackup_comment }}"
        state: "absent"

    - name: "Setup | Uninstall | Remove the nginx.conf backup file"
      ansible.builtin.file:
        path: "{{ __run_nginx_config_service_file_distbackup_path }}"
        state: "absent"


- name: "Setup | Uninstall | Remove module config directory (modules-enabled)"
  ansible.builtin.file:
    path: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}"
    state: "absent"
  when:
    - ansible_facts['os_family'] != 'Debian'


# modules-enabled is kept on Debian (package directory): remove the
# marker-carrying load_module files this role wrote and the symlinks for the
# module universe this role manages (symlinks cannot carry a marker; links
# shipped by module packages are removed with their package anyway).
- name: "Setup | Uninstall | Find remaining module config files (Debian)"
  ansible.builtin.find:
    paths:
      - "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}"
    patterns:
      - "*.conf"
    file_type: "file"
    hidden: true
  register: __run_nginx_uninstall_modules_find_result
  when:
    - ansible_facts['os_family'] == 'Debian'


- name: "Setup | Uninstall | Determine marker-managed module config files (Debian)"
  ansible.builtin.command:
    argv: >-
      {{
        [__run_nginx_grep_exec_path, '-l', '-s', '-x', '-F', '--', __run_nginx_config_file_marker]
        + (__run_nginx_uninstall_modules_find_result['files']
           | ansible.builtin.map(attribute='path') | ansible.builtin.list)
      }}
  register: __run_nginx_uninstall_modules_owned_result
  changed_when: false
  failed_when:
    - __run_nginx_uninstall_modules_owned_result['rc'] not in [0, 1, 2]
  when:
    - ansible_facts['os_family'] == 'Debian'
    - (__run_nginx_uninstall_modules_find_result['files'] | ansible.builtin.length) > 0


- name: "Setup | Uninstall | Remove marker-managed module config files (Debian)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop: "{{ __run_nginx_uninstall_modules_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - ansible_facts['os_family'] == 'Debian'


- name: "Setup | Uninstall | Remove role-managed module config symlinks (Debian)"
  ansible.builtin.file:
    path: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}/{{ item }}"
    state: "absent"
  when:
    - ansible_facts['os_family'] == 'Debian'
  loop: >-
    {{
      __run_nginx_modules_map_resources.values()
      | ansible.builtin.map(attribute='conf_files')
      | ansible.builtin.flatten
      | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'symlink')
      | ansible.builtin.map(attribute='name')
      | ansible.builtin.unique
      | ansible.builtin.list
    }}
  loop_control:
    label: "{{ item }}"


- name: "Setup | Uninstall | Remove /etc/nginx/modules symlink (non-Debian platforms)"
  ansible.builtin.file:
    path: "/etc/nginx/modules"
    state: "absent"
  when:
    - ansible_facts['os_family'] != 'Debian'


- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __run_nginx_packages_uninstall }}"
    state: "absent"
  when:
    - __run_nginx_packages_uninstall is ansible.builtin.defined
    - (__run_nginx_packages_uninstall | ansible.builtin.length) > 0
