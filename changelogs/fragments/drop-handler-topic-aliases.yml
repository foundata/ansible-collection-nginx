---
minor_changes:
  - >-
    Remove the previous handler topics ahead of the announced version 2.0.0:
    "run_nginx: validate configuration", "run_nginx: restart nginx.service",
    "run_nginx: reload nginx.service" and "run_nginx: systemd
    daemon-reload". Notify the role-prefixed topics instead. We decided that
    this is a non-breaking change: the topics are role internals, and their
    use by third parties is very unlikely.
