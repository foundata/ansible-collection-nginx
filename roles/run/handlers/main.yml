---
- name: "Handlers | Validate NGINX configuration"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate.yml"
  listen:
    - "run_nginx_validate_configuration"

# Both topics can be notified in the same flush. Record the stronger request
# before the shared handler runs; a restart also applies pending reloads.
- name: "Handlers | Request a restart for this flush"
  ansible.builtin.set_fact:
    __run_nginx_restart_pending: true
  listen:
    - "run_nginx_restart_nginx"

- name: "Handlers | Apply the requested NGINX configuration change"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apply.yml"
  listen:
    - "run_nginx_restart_nginx"
    - "run_nginx_reload_nginx"

- name: "Handlers | systemd daemon-reload"
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen:
    - "run_nginx_reload_systemd_daemon"
