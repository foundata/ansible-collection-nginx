# Configuration: Manage settings, like adapting or creating config files.

---

- name: "Config | Default | Ensure existence and permissions of directories and files"
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    state: "{{ item['state'] }}"
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    mode: "{{ item['mode'] }}"
    access_time: "preserve"
    modification_time: "preserve"
  loop:
    - path: "{{ __run_nginx_config_service_file_path }}"
      state: "touch"
      owner: "{{ __run_nginx_config_service_file_owner }}"
      group: "{{ __run_nginx_config_service_file_group }}"
      mode: "{{ __run_nginx_config_service_file_mode }}"

    - path: "{{ __run_nginx_config_service_dropin_sites_available_dir_path }}"
      state: "directory"
      owner: "{{ __run_nginx_config_service_dropin_sites_available_dir_owner }}"
      group: "{{ __run_nginx_config_service_dropin_sites_available_dir_group }}"
      mode: "{{ __run_nginx_config_service_dropin_sites_available_dir_mode }}"

    - path: "{{ __run_nginx_config_service_dropin_sites_enabled_dir_path }}"
      state: "directory"
      owner: "{{ __run_nginx_config_service_dropin_sites_enabled_dir_owner }}"
      group: "{{ __run_nginx_config_service_dropin_sites_enabled_dir_group }}"
      mode: "{{ __run_nginx_config_service_dropin_sites_enabled_dir_mode }}"

    - path: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}"
      state: "directory"
      owner: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_owner }}"
      group: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_group }}"
      mode: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_mode }}"

    - path: "{{ __run_nginx_log_dir_path }}"
      state: "directory"
      owner: "{{ __run_nginx_log_dir_owner }}"
      group: "{{ __run_nginx_log_dir_group }}"
      mode: "{{ __run_nginx_log_dir_mode }}"

    - path: "{{ __run_nginx_access_log_default_file_path }}"
      state: "touch"
      owner: "{{ __run_nginx_access_log_default_file_owner }}"
      group: "{{ __run_nginx_access_log_default_file_group }}"
      mode: "{{ __run_nginx_access_log_default_file_mode }}"

    - path: "{{ __run_nginx_error_log_default_file_path }}"
      state: "touch"
      owner: "{{ __run_nginx_error_log_default_file_owner }}"
      group: "{{ __run_nginx_error_log_default_file_group }}"
      mode: "{{ __run_nginx_error_log_default_file_mode }}"

  loop_control:
    label: "{{ item['path'] }}"
  notify:
    - "run_nginx: validate configuration"
    - "run_nginx: restart nginx.service"


## Backup original main config file (nginx.conf) if needed

- name: "Config | Default | Check if platform's original nginx.conf backup already exists"
  ansible.builtin.stat:
    path: "{{ __run_nginx_config_service_file_distbackup_path }}"
  register: __run_nginx_distbackup_stat


- name: "Config | Default | Check if current config is already Ansible managed"
  ansible.builtin.slurp:
    src: "{{ __run_nginx_config_service_file_path }}"
  register: __run_nginx_config_current_content
  when:
    - not __run_nginx_distbackup_stat['stat']['exists']


- name: "Config | Default | Backup the platform's original nginx.conf"
  ansible.builtin.copy:
    src: "{{ __run_nginx_config_service_file_path }}"
    dest: "{{ __run_nginx_config_service_file_distbackup_path }}"
    owner: "{{ __run_nginx_config_service_file_distbackup_owner }}"
    group: "{{ __run_nginx_config_service_file_distbackup_group }}"
    mode: "{{ __run_nginx_config_service_file_distbackup_mode }}"
    remote_src: true
  when:
    - not __run_nginx_distbackup_stat['stat']['exists']
    - "'Ansible managed' not in (__run_nginx_config_current_content['content'] | ansible.builtin.b64decode)"


- name: "Config | Default | Add backup notice comment to the nginx.conf backup"
  ansible.builtin.lineinfile:
    path: "{{ __run_nginx_config_service_file_distbackup_path }}"
    line: "{{ __run_nginx_config_service_file_distbackup_comment }}"
    insertbefore: "BOF"
  when:
    - not __run_nginx_distbackup_stat['stat']['exists']
    - "'Ansible managed' not in (__run_nginx_config_current_content['content'] | ansible.builtin.b64decode)"


## Main config file (nginx.conf)

- name: "Config | Default | Create or update the main configuration file (nginx.conf)"
  ansible.builtin.template:
    src: "nginx.conf.j2"
    dest: "{{ __run_nginx_config_service_file_path }}"
    owner: "{{ __run_nginx_config_service_file_owner }}"
    group: "{{ __run_nginx_config_service_file_group }}"
    mode: "{{ __run_nginx_config_service_file_mode }}"
  vars:
    # Pass (and/or adjust) variables needed for the templates
    tpl_main_config_block: "{{ run_nginx_main_config_block }}"
    tpl_main_config_baseline_manage: "{{ run_nginx_main_config_baseline_manage }}"
    tpl_main_config_baseline_directives: "{{ __run_nginx_effective_main_directives }}"
    tpl_events_config_block: "{{ run_nginx_events_config_block }}"
    tpl_events_config_baseline_manage: "{{ run_nginx_events_config_baseline_manage }}"
    tpl_events_config_baseline_directives: "{{ __run_nginx_effective_events_directives }}"
    tpl_http_config_block: "{{ run_nginx_http_config_block }}"
    tpl_http_config_baseline_manage: "{{ run_nginx_http_config_baseline_manage }}"
    tpl_http_config_baseline_directives: "{{ __run_nginx_effective_http_directives }}"
    tpl_http_config_defaultserver_manage: "{{ run_nginx_sites_defaultserver_manage }}"
  notify:
    - "run_nginx: validate configuration"
    - "run_nginx: restart nginx.service"


## Config snippets

- name: "Config | Default | Manage config snippets"
  when:
    - run_nginx_snippets_manage
  block:

    - name: "Config | Default | Ensure existence and permissions of snippet directories"
      ansible.builtin.file:
        path: "{{ item['path'] }}"
        state: "directory"
        owner: "{{ item['owner'] }}"
        group: "{{ item['group'] }}"
        mode: "{{ item['mode'] }}"
        access_time: "preserve"
        modification_time: "preserve"
      loop:
        - path: "{{ __run_nginx_config_service_dropin_snippets_dir_path }}"
          owner: "{{ __run_nginx_config_service_dropin_snippets_dir_owner }}"
          group: "{{ __run_nginx_config_service_dropin_snippets_dir_group }}"
          mode: "{{ __run_nginx_config_service_dropin_snippets_dir_mode }}"

        - path: "{{ __run_nginx_config_service_dropin_snippets_http_dir_path }}"
          owner: "{{ __run_nginx_config_service_dropin_snippets_http_dir_owner }}"
          group: "{{ __run_nginx_config_service_dropin_snippets_http_dir_group }}"
          mode: "{{ __run_nginx_config_service_dropin_snippets_http_dir_mode }}"

        - path: "{{ __run_nginx_config_service_dropin_snippets_location_dir_path }}"
          owner: "{{ __run_nginx_config_service_dropin_snippets_location_dir_owner }}"
          group: "{{ __run_nginx_config_service_dropin_snippets_location_dir_group }}"
          mode: "{{ __run_nginx_config_service_dropin_snippets_location_dir_mode }}"

        - path: "{{ __run_nginx_config_service_dropin_snippets_server_dir_path }}"
          owner: "{{ __run_nginx_config_service_dropin_snippets_server_dir_owner }}"
          group: "{{ __run_nginx_config_service_dropin_snippets_server_dir_group }}"
          mode: "{{ __run_nginx_config_service_dropin_snippets_server_dir_mode }}"
      loop_control:
        label: "{{ item['path'] }}"
      notify:
        - "run_nginx: validate configuration"
        - "run_nginx: restart nginx.service"


    - name: "Config | Default | Deploy Diffie-Hellman (DH) parameters file for TLS baseline snippet"
      ansible.builtin.copy:
        src: "dhparam_ffdhe3072.pem"
        dest: "{{ __run_nginx_dhparam_ffdhe3072_path }}"
        owner: "{{ __run_nginx_dhparam_ffdhe3072_owner }}"
        group: "{{ __run_nginx_dhparam_ffdhe3072_group }}"
        mode: "{{ __run_nginx_dhparam_ffdhe3072_mode }}"
      notify:
        - "run_nginx: validate configuration"
        - "run_nginx: restart nginx.service"


    - name: "Config | Default | Create or update config snippet files (to provide common, centrally maintained config blocks to include)"
      ansible.builtin.template:
        src: "{{ item }}"
        dest: >-
          {{ __run_nginx_config_service_dropin_snippets_dir_path }}/{{
            item
            | ansible.builtin.dirname
            | ansible.builtin.basename
          }}/{{
            item
            | ansible.builtin.basename
            | ansible.builtin.splitext
            | ansible.builtin.first
          }}
        owner: "{{ __run_nginx_config_service_dropin_file_owner }}"
        group: "{{ __run_nginx_config_service_dropin_file_group }}"
        mode: "{{ __run_nginx_config_service_dropin_file_mode }}"
      vars:
        # Pass (and/or adjust) variables needed for the templates
        tpl_settings: "{{ __run_nginx_effective_snippet_settings }}"
      with_fileglob:
        - "templates/snippets/*.conf.j2"
        - "templates/snippets/http/*.conf.j2"
        - "templates/snippets/location/*.conf.j2"
        - "templates/snippets/server/*.conf.j2"
      notify:
        - "run_nginx: validate configuration"
        - "run_nginx: restart nginx.service"


- name: "Config | Default | Delete stale / unmanaged config snippets"
  when:
    - run_nginx_snippets_manage
    - run_nginx_snippets_delete_unmanaged
  block:

    - name: "Config | Default | Build list of expected config snippet filenames"
      ansible.builtin.set_fact:
        __run_nginx_expected_snippet_filenames: >-
          {{
            (
                query('ansible.builtin.fileglob', 'templates/snippets/*.conf.j2')
              + query('ansible.builtin.fileglob', 'templates/snippets/http/*.conf.j2')
              + query('ansible.builtin.fileglob', 'templates/snippets/location/*.conf.j2')
              + query('ansible.builtin.fileglob', 'templates/snippets/server/*.conf.j2')
            )
            | ansible.builtin.map('ansible.builtin.basename')
            | ansible.builtin.map('ansible.builtin.regex_replace', '\.j2$', '')
            | ansible.builtin.list
          }}


    - name: "Config | Default | List existing config snippet files"
      ansible.builtin.find:
        paths:
          - "{{ __run_nginx_config_service_dropin_snippets_dir_path }}"
        patterns:
          - "*.conf"
        file_type: "file"
        hidden: true
      register: __run_nginx_snippet_conf_files


    - name: "Config | Default | Remove stale, unmanaged site files (not in run_nginx_sites_config)"
      ansible.builtin.file:
        path: "{{ item['path'] }}"
        state: "absent"
      loop: >-
        {{
          __run_nginx_snippet_conf_files['files']
          | ansible.builtin.rejectattr('path', 'ansible.builtin.search', '/(' ~ (__run_nginx_expected_snippet_filenames
                                                                                 | ansible.builtin.map('ansible.builtin.regex_escape')
                                                                                 | ansible.builtin.join('|')) ~ ')$')
          | ansible.builtin.list
        }}
      loop_control:
        label: "{{ item['path'] }}"
      when:
        - (__run_nginx_snippet_conf_files['files'] | ansible.builtin.length) > 0
      notify:
        - "run_nginx: validate configuration"
        - "run_nginx: reload nginx.service"


## Sites

- name: "Config | Default | Validate nginx site (config file) names"
  ansible.builtin.fail:
    msg: >-
      Invalid site name "{{ item['name'] }}".
      Allowed characters are: a-z, A-Z, 0-9, dot (.), underscore (_), and hyphen (-).
  loop: "{{ run_nginx_sites_config | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item['name'] }}"
  when:
    - item['name'] is not ansible.builtin.match('^[a-zA-Z0-9._-]+$')


# Each entry writes '<name>.conf' and manages the matching enable-symlink, so
# entries sharing a name rewrite the same file with different content on every
# run: the result is order-dependent and never idempotent.
- name: "Config | Default | Validate nginx site (config file) names are unique"
  ansible.builtin.fail:
    msg: >-
      Duplicate site name(s) in 'run_nginx_sites_config':
      {{ __run_nginx_site_name_duplicates | ansible.builtin.unique | ansible.builtin.join(', ') }}.
      Each entry writes '<name>.conf', so entries sharing a name overwrite each
      other's configuration file on every run.
  vars:
    __run_nginx_site_names: >-
      {{
        run_nginx_sites_config
        | ansible.builtin.default([])
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.list
      }}
    __run_nginx_site_name_duplicates: >-
      {%- set _seen = [] -%}
      {%- set _dupes = [] -%}
      {%- for _name in __run_nginx_site_names -%}
      {%-   if _name in _seen -%}
      {%-     set _ = _dupes.append(_name) -%}
      {%-   else -%}
      {%-     set _ = _seen.append(_name) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ _dupes }}
  when:
    - (__run_nginx_site_names | ansible.builtin.length)
      != (__run_nginx_site_names | ansible.builtin.unique | ansible.builtin.length)


- name: "Config | Default | Create or update site config files"
  ansible.builtin.template:
    src: "site.conf.j2"
    dest: "{{ __run_nginx_config_service_dropin_sites_available_dir_path }}/{{ __run_nginx_loop_file_name }}"
    owner: "{{ __run_nginx_config_service_dropin_sites_available_dir_owner }}"
    group: "{{ __run_nginx_config_service_dropin_sites_available_dir_group }}"
    mode: "{{ __run_nginx_config_service_dropin_file_mode }}"
  vars:
    __run_nginx_loop_file_name: "{{ item['name'] }}.conf"
    # Pass (and/or adjust) variables needed for the template
    tpl_content: "{{ item['content'] }}"
  loop: "{{ run_nginx_sites_config | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ __run_nginx_config_service_dropin_sites_available_dir_path }}/{{ __run_nginx_loop_file_name }}"
  when:
    - ((run_nginx_sites_config | ansible.builtin.default([])) | ansible.builtin.length) > 0
  notify:
    - "run_nginx: validate configuration"
    - "run_nginx: reload nginx.service"


- name: "Config | Default | Enable/disable site symlinks"
  ansible.builtin.file:
    # src/owner/group/mode must be omitted for state "absent": passing src
    # alongside state "absent" is a module error, so a disabled (or
    # enabled-by-default-false) site entry would otherwise fail the run.
    src: >-
      {{ __run_nginx_loop_enabled | ansible.builtin.ternary(
           __run_nginx_config_service_dropin_sites_available_dir_path
           ~ '/' ~ __run_nginx_loop_file_name, omit) }}
    dest: "{{ __run_nginx_config_service_dropin_sites_enabled_dir_path }}/{{ __run_nginx_loop_file_name }}"
    state: "{{ __run_nginx_loop_enabled | ansible.builtin.ternary('link', 'absent') }}"
    owner: "{{ __run_nginx_loop_enabled | ansible.builtin.ternary(__run_nginx_config_service_dropin_file_owner, omit) }}"
    group: "{{ __run_nginx_loop_enabled | ansible.builtin.ternary(__run_nginx_config_service_dropin_file_group, omit) }}"
    mode: "{{ __run_nginx_loop_enabled | ansible.builtin.ternary(__run_nginx_config_service_dropin_file_mode, omit) }}"
    force: true
  vars:
    __run_nginx_loop_file_name: "{{ item['name'] }}.conf"
    __run_nginx_loop_enabled: "{{ item['enabled'] | ansible.builtin.default(false) }}"
  loop: "{{ run_nginx_sites_config | ansible.builtin.default([]) }}"
  loop_control:
    label: >-
      {{ __run_nginx_config_service_dropin_sites_enabled_dir_path }}/{{ __run_nginx_loop_file_name }}
      -> {{ __run_nginx_config_service_dropin_sites_available_dir_path }}/{{ __run_nginx_loop_file_name }}
  when:
    - (run_nginx_sites_config | ansible.builtin.default([])) | ansible.builtin.length > 0
  notify:
    - "run_nginx: validate configuration"
    - "run_nginx: reload nginx.service"


- name: "Config | Default | Delete stale / unmanaged site configs"
  when:
    - run_nginx_sites_delete_unmanaged
  block:

    - name: "Config | Default | Build list of expected site config filenames"
      ansible.builtin.set_fact:
        __run_nginx_expected_site_filenames: >-
          {{
            (run_nginx_sites_config | ansible.builtin.default([]))
            | ansible.builtin.map(attribute='name')
            | ansible.builtin.map('ansible.builtin.regex_replace', '$', '.conf')
            | ansible.builtin.list
          }}


    - name: "Config | Default | List existing site config files"
      ansible.builtin.find:
        paths:
          - "{{ __run_nginx_config_service_dropin_sites_available_dir_path }}"
          - "{{ __run_nginx_config_service_dropin_sites_enabled_dir_path }}"
        patterns:
          - "*.conf"
        # "any" so the enabled-site symlinks (sites-enabled/*.conf) are matched
        # too; with "file" they were skipped and stale enabled vhosts stayed
        # active after a site was removed from run_nginx_sites_config. Real
        # directories are excluded again before removal (rejectattr('isdir')
        # below) so a '*.conf'-named subdirectory is never deleted recursively.
        file_type: "any"
        hidden: true
      register: __run_nginx_site_conf_files


    - name: "Config | Default | Remove stale, unmanaged site config files (not in run_nginx_sites_config)"
      ansible.builtin.file:
        path: "{{ item['path'] }}"
        state: "absent"
      loop: >-
        {{
          __run_nginx_site_conf_files['files']
          | ansible.builtin.rejectattr('isdir')
          | ansible.builtin.rejectattr('path', 'ansible.builtin.search', '/(' ~ (__run_nginx_expected_site_filenames
                                                                                 | ansible.builtin.map('ansible.builtin.regex_escape')
                                                                                 | ansible.builtin.join('|')) ~ ')$')
          | ansible.builtin.list
        }}
      loop_control:
        label: "{{ item['path'] }}"
      when:
        - (__run_nginx_site_conf_files['files'] | ansible.builtin.length) > 0
      notify:
        - "run_nginx: validate configuration"
        - "run_nginx: reload nginx.service"


### Modules
#
# Module config files are placed directly into modules-enabled/. Filenames
# are platform-specific and explicitly declared in
# __run_nginx_modules_map_resources (conf_files key). Entries of type
# "symlink" re-use package-provided .conf files; entries of type
# "load_module" generate .conf files from .so paths via template.

- name: "Config | Default | Manage module load configs"
  when:
    - (run_nginx_modules_enabled | ansible.builtin.default([]) | ansible.builtin.length) > 0
  block:

    - name: "Config | Default | Ensure /etc/nginx/modules symlink exists (for relative load_module paths)"
      ansible.builtin.file:
        src: "{{ __run_nginx_module_so_lib_dir_path }}"
        dest: "/etc/nginx/modules"
        state: "link"
        force: true


    - name: "Config | Default | Build flat list of module conf_files entries for all enabled modules"
      ansible.builtin.set_fact:
        __run_nginx_module_conf_entries: >-
          {{
            run_nginx_modules_enabled
            | ansible.builtin.default([])
            | ansible.builtin.select('ansible.builtin.in', __run_nginx_modules_map_resources.keys() | ansible.builtin.list)
            | ansible.builtin.map('ansible.builtin.extract', __run_nginx_modules_map_resources)
            | ansible.builtin.map(attribute='conf_files')
            | ansible.builtin.flatten
            | ansible.builtin.unique(attribute='name')
            | ansible.builtin.list
          }}


    - name: "Config | Default | Create symlinks for package-provided module config files"
      ansible.builtin.file:
        src: "{{ item['target'] }}"
        dest: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}/{{ item['name'] }}"
        state: "link"
        force: true
      when:
        - item['type'] == 'symlink'
      loop: "{{ __run_nginx_module_conf_entries }}"
      loop_control:
        label: >-
          {{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}/{{ item['name'] }}
          -> {{ item['target'] }}
      notify:
        - "run_nginx: validate configuration"
        - "run_nginx: restart nginx.service"


    - name: "Config | Default | Create load_module config files for modules without package-provided ones"
      ansible.builtin.template:
        src: "module-load.conf.j2"
        dest: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}/{{ item['name'] }}"
        owner: "{{ __run_nginx_config_service_dropin_file_owner }}"
        group: "{{ __run_nginx_config_service_dropin_file_group }}"
        mode: "{{ __run_nginx_config_service_dropin_file_mode }}"
      vars:
        # Pass (and/or adjust) variables needed for the templates
        tpl_module_so_paths: >-
          {{
            [item['target']]
            if (item['target'] is ansible.builtin.string)
            else item['target']
          }}
      when:
        - item['type'] == 'load_module'
      loop: "{{ __run_nginx_module_conf_entries }}"
      loop_control:
        label: "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}/{{ item['name'] }}"
      notify:
        - "run_nginx: validate configuration"
        - "run_nginx: restart nginx.service"


# Only files whose name is part of the role's module map are ever removed, so
# distribution-provided files in modules-enabled/ (with names the role does not
# know) are never touched. For symlinks, "state: absent" removes only the link,
# never the linked target.
- name: "Config | Default | Delete stale role-managed module configs"
  when:
    - run_nginx_modules_disable_unmanaged
  block:

    - name: "Config | Default | Build the role-managed and currently-enabled module config filename sets"
      ansible.builtin.set_fact:
        # Every module config filename the role could deploy (across all modules
        # in the platform's module map), regardless of what is enabled now.
        __run_nginx_modules_managed_filenames: >-
          {{
            __run_nginx_modules_map_resources.values()
            | ansible.builtin.map(attribute='conf_files')
            | ansible.builtin.flatten
            | ansible.builtin.map(attribute='name')
            | ansible.builtin.unique
            | ansible.builtin.list
          }}
        # The subset that should remain: config filenames of the currently
        # enabled modules.
        __run_nginx_modules_expected_filenames: >-
          {{
            (run_nginx_modules_enabled | ansible.builtin.default([]))
            | ansible.builtin.select('ansible.builtin.in', __run_nginx_modules_map_resources.keys() | ansible.builtin.list)
            | ansible.builtin.map('ansible.builtin.extract', __run_nginx_modules_map_resources)
            | ansible.builtin.map(attribute='conf_files')
            | ansible.builtin.flatten
            | ansible.builtin.map(attribute='name')
            | ansible.builtin.unique
            | ansible.builtin.list
          }}


    - name: "Config | Default | List existing module config files in modules-enabled"
      ansible.builtin.find:
        paths:
          - "{{ __run_nginx_config_service_dropin_modules_enabled_dir_path }}"
        patterns:
          - "*.conf"
        file_type: "any"
        hidden: true
      register: __run_nginx_module_conf_files


    - name: "Config | Default | Remove stale role-managed module configs (in the role's map, not currently enabled)"
      ansible.builtin.file:
        path: "{{ item['path'] }}"
        state: "absent"
      loop: >-
        {{
          __run_nginx_module_conf_files['files']
          | ansible.builtin.rejectattr('isdir')
          | ansible.builtin.selectattr('path', 'ansible.builtin.search', '/(' ~ (__run_nginx_modules_managed_filenames
                                                                 | ansible.builtin.map('ansible.builtin.regex_escape')
                                                                 | ansible.builtin.join('|')) ~ ')$')
          | ansible.builtin.rejectattr('path', 'ansible.builtin.search', '/(' ~ (__run_nginx_modules_expected_filenames
                                                                 | ansible.builtin.map('ansible.builtin.regex_escape')
                                                                 | ansible.builtin.join('|')) ~ ')$')
          | ansible.builtin.list
        }}
      loop_control:
        label: "{{ item['path'] }}"
      notify:
        - "run_nginx: validate configuration"
        - "run_nginx: restart nginx.service"
