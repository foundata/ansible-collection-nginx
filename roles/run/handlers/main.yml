# SPDX-License-Identifier: GPL-3.0-or-later

---
- name: "Handlers | Validate NGINX configuration"
  ansible.builtin.command:
    argv:
      - "{{ __run_nginx_server_exec_path }}"
      - "-t"
  changed_when:
    - false
  failed_when:
    - __run_nginx_validation_result is ansible.builtin.failed
  register: __run_nginx_validation_result
  listen:
    - "run_nginx_validate_configuration"
    # Migration alias; remove in 2.0.0.
    - "run_nginx: validate configuration"
- name: "Handlers | NGINX service restart"
  ansible.builtin.systemd_service:
    name: "{{ __run_nginx_nginx_servicename }}"
    state: "restarted"
  when:
    - run_nginx_service_state in ['enabled', 'running']
  listen:
    - "run_nginx_restart_nginx"
    # Migration alias; remove in 2.0.0.
    - "run_nginx: restart nginx.service"
- name: "Handlers | NGINX service reload"
  ansible.builtin.systemd_service:
    name: "{{ __run_nginx_nginx_servicename }}"
    state: "reloaded"
  when:
    - run_nginx_service_state in ['enabled', 'running']
  listen:
    - "run_nginx_reload_nginx"
    # Migration alias; remove in 2.0.0.
    - "run_nginx: reload nginx.service"
- name: "Handlers | systemd daemon-reload"
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen:
    - "run_nginx_reload_systemd_daemon"
    # Migration alias; remove in 2.0.0.
    - "run_nginx: systemd daemon-reload"
